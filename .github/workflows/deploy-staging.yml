name: Deploy Phindu Staging

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

concurrency:
  group: phindu-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'deploy-to-staging'
    runs-on: ubuntu-latest
    environment: staging
    env:
      PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
      E2E_PRODUCT_CODE: ${{ secrets.E2E_PRODUCT_CODE }}
      E2E_HOUSE_PRODUCT_CODE: ${{ secrets.E2E_HOUSE_PRODUCT_CODE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require isolated staging credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_SEED_PASSWORD E2E_PRODUCT_CODE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing staging environment secret: $name"
              exit 1
            fi
          done
          if [[ "$PROJECT_ID" == "seobilifwyxhtjvsgqpc" || "$PROJECT_ID" == "yqrfheavftgybhcafzpt" ]]; then
            echo "::error::Staging workflow refuses a Phindu production Supabase project."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != "https://${PROJECT_ID}.supabase.co" ]]; then
            echo "::error::Staging Supabase URL does not match the configured staging project reference."
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Link isolated staging project
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview staging database migrations
        run: supabase db push --dry-run --linked

      - name: Apply staging database migrations
        run: supabase db push --linked --yes

      - name: Deploy staging Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_ID"

      - name: Seed safe, repeatable UAT accounts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          STAGING_SEED_CONFIRM: "1"
          SEED_BORROWER_COUNT: "5"
          SEED_STAFF_COUNT: "5"
        run: node scripts/seed-staging-uat.mjs

      - name: Build borrower PWA for staging
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          VITE_BORROWER_APP_URL: https://staging-app.phindu.com
          VITE_OFFICE_BASE_URL: https://staging-office.phindu.com
          VITE_MARKETING_BASE_URL: https://phindu.com
        run: |
          npm run build:borrower
          npm run audit:pwa

      - name: Deploy borrower staging app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.110.0 deploy --config wrangler.borrower.staging.jsonc

      - name: Build staff web for staging
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          VITE_BORROWER_APP_URL: https://staging-app.phindu.com
          VITE_OFFICE_BASE_URL: https://staging-office.phindu.com
          VITE_MARKETING_BASE_URL: https://phindu.com
          VITE_SITE_MODE: office
          STAFF_SITE_MODE: office
        run: npm run build:staff

      - name: Deploy staff staging app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.110.0 deploy --config wrangler.staff.staging.jsonc

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test borrower staging sign-in and dashboard
        env:
          E2E_BASE_URL: https://staging-app.phindu.com
          E2E_BORROWER_EMAIL: uat-borrower-0001@phindu-staging.test
          E2E_BORROWER_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
        run: npm run test:e2e:smoke -- --grep "borrower portal smoke"

      - name: Test staff staging access and permissions
        env:
          E2E_BASE_URL: https://staging-office.phindu.com
          E2E_FINANCE_EMAIL: uat-staff-0003@phindu-staging.test
          E2E_FINANCE_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
          E2E_STAFF_LOW_EMAIL: uat-staff-0002@phindu-staging.test
          E2E_STAFF_LOW_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
          E2E_HOUSE_PRODUCT_CODE: ${{ secrets.E2E_PRODUCT_CODE }}
          E2E_SEEDED_EXPENSE_VENDOR: ${{ secrets.E2E_SEEDED_EXPENSE_VENDOR }}
        run: npm run test:e2e:smoke -- --grep "admin hardening smoke"

      - name: Test staging loan lifecycle
        env:
          E2E_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          E2E_STAFF_EMAIL: uat-staff-0001@phindu-staging.test
          E2E_STAFF_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
          E2E_PRODUCT_CODE: ${{ secrets.E2E_PRODUCT_CODE }}
        run: npm run test:integration:loan-flow
