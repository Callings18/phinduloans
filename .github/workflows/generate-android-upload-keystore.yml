name: Generate Android upload keystore (one-time)

# Run once, download artifact, add secrets, then delete/disable this workflow.
on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Strong password for upload keystore (save in password manager)"
        required: true
        type: string

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create upload keystore
        run: |
          keytool -genkey -v \
            -keystore phindu-borrower-upload.jks \
            -alias phindu-borrower \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.keystore_password }}" \
            -keypass "${{ inputs.keystore_password }}" \
            -dname "CN=Phindu Credit Solutions, OU=Mobile, O=Phindu, L=Lusaka, ST=Lusaka, C=ZM"
          echo "Use the same password you entered when starting this workflow."

      - name: Base64 encode for GitHub secret
        run: |
          base64 -w0 phindu-borrower-upload.jks > phindu-borrower-upload.jks.b64
          echo "### Upload keystore (ONE TIME)" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Download artifact **phindu-upload-keystore** and store **phindu-borrower-upload.jks** offline." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Add repo secrets: \`ANDROID_KEYSTORE_BASE64\` (contents of .b64 file), \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS=phindu-borrower\`, \`ANDROID_KEY_PASSWORD\` (same as store pass)." >> "$GITHUB_STEP_SUMMARY"
          echo "3. **Change passwords** in secrets to your own strong password (re-encode keystore with keytool if you change pass)." >> "$GITHUB_STEP_SUMMARY"
          echo "4. Run **Build borrower AAB (Play Store)**." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use the password you typed when you started this workflow." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: phindu-upload-keystore
          path: |
            phindu-borrower-upload.jks
            phindu-borrower-upload.jks.b64
          retention-days: 7
