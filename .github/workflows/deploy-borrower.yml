name: Deploy Borrower PWA

on:
  push:
    branches: [main]
    paths:
      - "apps/borrower-mobile/**"
      - "packages/shared/**"
      - "wrangler.borrower.jsonc"
      - "scripts/deploy-borrower.mjs"
      - "scripts/audit-borrower-pwa.mjs"
      - ".github/workflows/deploy-borrower.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build borrower PWA
        env:
          VITE_SUPABASE_URL: https://seobilifwyxhtjvsgqpc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XCivuEj5jQ96iYtn1jV_2A_ieIDSnC9
          VITE_BORROWER_APP_URL: https://app.phindu.com
          VITE_OFFICE_BASE_URL: https://office.phindu.com
          VITE_MARKETING_BASE_URL: https://phindu.com
        run: |
          npm run build:borrower
          npm run audit:pwa

      - name: Upload borrower dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: borrower-pwa-dist
          path: apps/borrower-mobile/dist
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required to deploy app.phindu.com."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Download borrower dist
        uses: actions/download-artifact@v4
        with:
          name: borrower-pwa-dist
          path: apps/borrower-mobile/dist

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.110.0 deploy --config wrangler.borrower.jsonc

      - name: Deploy summary
        run: echo "Borrower PWA deployed — verify https://app.phindu.com/auth"

