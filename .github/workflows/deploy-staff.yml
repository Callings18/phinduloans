name: Deploy Staff Web

on:
  push:
    branches: [main]
    paths:
      - "apps/staff-web/**"
      - "packages/shared/**"
      - "wrangler.staff.jsonc"
      - "wrangler.jsonc"
      - "scripts/deploy-staff.mjs"
      - "package.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required to deploy office.phindu.com."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build & deploy staff web (office)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: https://seobilifwyxhtjvsgqpc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XCivuEj5jQ96iYtn1jV_2A_ieIDSnC9
          VITE_BORROWER_APP_URL: https://app.phindu.com
          VITE_OFFICE_BASE_URL: https://office.phindu.com
          VITE_MARKETING_BASE_URL: https://phindu.com
          STAFF_SITE_MODE: office
        run: node scripts/deploy-staff.mjs
