[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Two services on the Railway trial: api + staff-web.
# staff-web uses PHINDU_SERVICE=web → landing, /admin, and /borrower on one domain.
# After upgrading Railway, split with PHINDU_SERVICE=office|marketing|borrower.

[deploy]
restartPolicyType = "ON_FAILURE"
